# Automated releases from Conventional Commits (https://www.conventionalcommits.org).
#
# On every push to main, release-please maintains a rolling "release PR" that
# accumulates the next version's changelog and version bumps (Cargo.toml,
# Cargo.lock, the Claude Code plugin manifests). Merging that PR creates the
# v* tag and the GitHub Release. release-please runs on a token from the release
# bot GitHub App, so the tag push starts release.yml, which builds and attaches
# the prebuilt binaries; a tag pushed with the default GITHUB_TOKEN would start
# no workflow at all.
name: release-please

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

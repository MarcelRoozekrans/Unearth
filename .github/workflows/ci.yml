name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt, clippy and llvm-tools
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        # cargo llvm-cov runs the same tests with coverage instrumentation and writes an lcov report.
        run: cargo llvm-cov --workspace --no-fail-fast --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true   # only the file above, not every report the search finds
          fail_ci_if_error: false

      # The dhat-heap feature gates code that --all-targets does not enable, so
      # check it builds (and clippy-clean) to keep the profiling harness from
      # rotting.
      - name: Clippy with dhat-heap feature
        run: cargo clippy --features dhat-heap --example heap_profile -- -D warnings
